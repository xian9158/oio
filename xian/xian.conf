# 冻结证书信任资产 1013 — Quantumult X 版
# 由 Loon 插件 Block-Apple-Trust-Asset.plugin 原样转换
# 拒绝 Apple OTA PKI / MobileAsset 资产目录与下载域名，阻止信任资产热更新。
# 只拦资产域名，放行激活、签名验证、OCSP/CRL 与 PPQ。
# 需 Quantumult X 处于运行状态（VPN 开启）且使用规则分流才生效。
#
# 转换说明（Loon -> Quantumult X）：
#   Loon [Rule] DOMAIN,域名,REJECT
#     -> QX [filter_local] host-suffix,域名,reject
#   这里用 host-suffix 而不是 host，是按原插件注释的建议：
#   “若需覆盖子域名，可把上面每行改成 DOMAIN-SUFFIX,域名,REJECT”
#   host-suffix 在 QX 里就是 DOMAIN-SUFFIX 的等价写法，
#   精确域名和子域名都会命中。
#   QX 里 host,域名,reject 会在 DNS 层返回 127.0.0.1。
#   Loon 没有 [filter_local] / [rewrite_local] 的区分，
#   QX 需要把规则放进 [filter_local]。
#
# 用法：把下面 [filter_local] 里的规则粘贴到你现有配置文件的
# [filter_local] 段落最上面，在你原来的 geoip / final 之前。
# 不要在这份片段里加 final 规则，用你原来的 final。
# 顺序：放行在前、拦截在后。

[filter_local]
# ---------- 放行：绝对不要拦的域名（按原插件注释原样转换） ----------
host-suffix, albert.apple.com, direct
host-suffix, humb.apple.com, direct
host-suffix, tbsc.apple.com, direct
host-suffix, static.ips.apple.com, direct
host-suffix, captive.apple.com, direct
host-suffix, gs.apple.com, direct
host-suffix, time.apple.com, direct
host-suffix, time-ios.apple.com, direct
host-suffix, ocsp.apple.com, direct
host-suffix, ocsp2.apple.com, direct
host-suffix, crl.apple.com, direct
host-suffix, certs.apple.com, direct
host-suffix, valid.apple.com, direct
host-suffix, ppq.apple.com, direct
host-suffix, appleid.apple.com, direct
host-suffix, idmsa.apple.com, direct
host-suffix, gsa.apple.com, direct

# ---------- 拦截：资产目录与元数据查询 ----------
host-suffix, mesu.apple.com, reject
host-suffix, gdmf.apple.com, reject

# ---------- 拦截：资产文件下载 ----------
host-suffix, updates.cdn-apple.com, reject
host-suffix, updates-http.cdn-apple.com, reject
host-suffix, appldnld.apple.com, reject

# ---------- 拦截：软件更新目录（与资产共用同一批服务） ----------
host-suffix, gg.apple.com, reject
host-suffix, xp.apple.com, reject

# ----------------------------------------------------------
# 验证：Safari 访问 https://mesu.apple.com，
#       在 Quantumult X 的请求记录里应看到命中本规则且结果为 REJECT。
# 停用：删除或注释掉上面这些行后保存即可，随时恢复。
# ----------------------------------------------------------
